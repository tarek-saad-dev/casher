name: CI

on:
  pull_request:
    branches: [main]
  schedule:
    - cron: '17 2 * * *'
  workflow_dispatch:

permissions:
  contents: read

# No production credentials; integration DB tests are never opted into CI.
env:
  INCLUDE_DB_INTEGRATION_TESTS: '0'

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  detect:
    name: Select affected regression groups
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      groups: ${{ steps.select.outputs.groups }}
      mode: ${{ steps.select.outputs.mode }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Select groups from the checked-out merge diff
        id: select
        env:
          CI_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: node scripts/ci/select-checks.mjs

  windows-print-startup:
    needs: detect
    if: ${{ needs.detect.result == 'success' && contains(fromJSON(needs.detect.outputs.groups), 'printing') }}
    name: Windows print agent startup syntax
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Parse PowerShell startup and uninstall scripts
        shell: pwsh
        run: |
          $scripts = @(
            'print-service/windows/run-agent.ps1',
            'print-service/windows/install-autostart.ps1',
            'print-service/windows/diagnose-printer.ps1',
            'print-service/windows/uninstall-autostart.ps1',
            'public/downloads/Install-CUT-Print-Agent.ps1',
            'public/downloads/Check-CUT-Print-Agent.ps1'
          )
          foreach ($script in $scripts) {
            $tokens = $null
            $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path $script).Path, [ref]$tokens, [ref]$errors
            )
            if ($errors.Count -gt 0) {
              throw "$script PowerShell syntax error: $($errors[0].Message)"
            }
          }

  thermal-print-agent:
    needs: detect
    if: ${{ needs.detect.result == 'success' && contains(fromJSON(needs.detect.outputs.groups), 'printing') }}
    name: Local print agent / ESC-POS regression
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install print agent
        run: npm ci --prefix print-service
      - name: Test raster encoder, queue and print endpoints (no physical printer)
        run: npm test --prefix print-service
      - name: Exercise the opt-in ESC/POS engine with mock spooler
        run: PRINT_ENGINE=escpos PRINT_ADAPTER=mock npm test --prefix print-service

  drvo-validation:
    needs: detect
    # Keep the existing required check name and fail if selection itself fails.
    if: ${{ always() && !cancelled() }}
    name: DRVO / booking / queue validation
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Require successful change selection
        env:
          DETECT_RESULT: ${{ needs.detect.result }}
        run: test "$DETECT_RESULT" = success

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Test the CI classifier and regression inventory
        run: node --test scripts/ci/*.test.mjs

      - name: Run selected domain regressions
        env:
          CI_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          CI_GROUPS: ${{ needs.detect.outputs.groups }}
        run: node scripts/ci/run-regressions.mjs

      # Keep independent tenant/security regressions mandatory on every PR.
      # These tests use isolated in-memory fixtures; they never connect to staging or production.
      - name: Tenant isolation and API entitlement security regression
        run: >
          npx vitest run
          src/platform/__tests__/qaCrossTenantEntitlement.test.ts
          src/platform/__tests__/drvo013TenantIsolation.test.ts
          src/platform/__tests__/drvo013RouteAuthGuards.test.ts
          src/platform/__tests__/drvo013TenantJobsAndGates.test.ts
          src/platform/__tests__/drvo015MasterDataIsolation.test.ts
          src/platform/__tests__/platformOutboxRollback.test.ts
          --reporter=default

      - name: Payroll rehearsal script syntax
        if: ${{ contains(fromJSON(needs.detect.outputs.groups), 'payroll') }}
        run: |
          bash -n scripts/payroll/run-ziad-payroll-rehearsal.sh
          bash -n scripts/payroll/resume-ziad-payroll-rehearsal.sh
          bash -n scripts/payroll/apply-v2-schema-production.sh

      - name: Payroll rehearsal TypeScript path resolution
        if: ${{ contains(fromJSON(needs.detect.outputs.groups), 'payroll') }}
        run: npx tsx --tsconfig tsconfig.json -e "import('@/lib/businessDate').then(m => { if (typeof m.getCairoBusinessDate !== 'function') process.exit(1) })"

      - name: Deploy script shell syntax
        run: bash -n deploy/deploy-casher

      - name: Database integration safety guard (never last132)
        run: npx vitest run src/lib/__tests__/assertApprovedTestDatabase.test.ts --reporter=default

      - name: DRVOWA CRM sync + audited deleted-sale tombstone regressions
        run: >-
          npx vitest run
          src/modules/integrations/drvowa/__tests__/drvowaValidate.test.ts
          src/modules/integrations/drvowa/__tests__/invoiceListDeletions.test.ts
          src/modules/integrations/drvowa/__tests__/tenantScopedCrmTools.test.ts
          scripts/drvo/__tests__/crmDrvowaStagingSafety.test.ts

      - name: Production build
        run: npm run build

      - name: Note known global typecheck debt
        run: |
          echo "Full-repo tsc --noEmit is known-failing on legacy unrelated modules."
          echo "This workflow scopes deterministic DRVO/booking/queue/build checks instead."
