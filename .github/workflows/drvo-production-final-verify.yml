name: DRVO Production Final Verify

on:
  push:
    branches:
      - drvo-public-production-smoke
    paths:
      - '.github/workflows/drvo-production-final-verify.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Configure SSH
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "$VPS_HOST" >> ~/.ssh/known_hosts

      - name: DRVO production verify
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          ssh -i ~/.ssh/id_ed25519 -o BatchMode=yes "$VPS_USER@$VPS_HOST" \
            "cd /home/casher/app && npx tsx scripts/drvo/verify-cli.ts --allow-production"

      - name: Production health
        run: |
          curl --fail --silent --show-error --max-time 30 https://ops.cutsaloon.com/api/health/ready
          echo
          echo "PRODUCTION_HEALTH=PASS"
