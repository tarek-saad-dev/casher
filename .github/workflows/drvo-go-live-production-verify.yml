name: Verify DRVO Go-Live Production

on:
  push:
    branches:
      - drvo-go-live-checklist-v1
    paths:
      - '.github/workflows/drvo-go-live-production-verify.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure SSH
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "$VPS_HOST" >> ~/.ssh/known_hosts

      - name: Upload read-only verifier
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          scp -i ~/.ssh/id_ed25519 -o BatchMode=yes \
            scripts/drvo/drvo-go-live-production-verify.ts \
            "$VPS_USER@$VPS_HOST:/home/casher/app/scripts/drvo/drvo-go-live-production-verify.ts"

      - name: Verify production go-live report
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          ssh -i ~/.ssh/id_ed25519 -o BatchMode=yes "$VPS_USER@$VPS_HOST" \
            "cd /home/casher/app && npx tsx scripts/drvo/drvo-go-live-production-verify.ts"

      - name: Cleanup verifier
        if: always()
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          ssh -i ~/.ssh/id_ed25519 -o BatchMode=yes "$VPS_USER@$VPS_HOST" \
            "rm -f /home/casher/app/scripts/drvo/drvo-go-live-production-verify.ts" || true
