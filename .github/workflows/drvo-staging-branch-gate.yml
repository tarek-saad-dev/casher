name: DRVO Staging Branch Gate
on:
  push:
    branches:
      - feature/drvo-clinics-mvp
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: drvo-staging-branch-gate
  cancel-in-progress: false
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install locked dependencies
        run: npm ci --ignore-scripts
      - name: Verify staging safety configuration script syntax
        run: bash -n scripts/drvo/staging-config-preflight.sh
      - name: Verify fail-closed staging guard
        run: bash scripts/drvo/staging-safety-static-gate.sh
      - name: Build without production secrets
        env:
          NEXT_TELEMETRY_DISABLED: '1'
          DRVO_STAGING_MODE: 'true'
          DRVO_STAGING_OUTBOUND_DISABLED: 'true'
          DRVO_STAGING_WORKERS_DISABLED: 'true'
          DRVO_STAGING_CRON_DISABLED: 'true'
          STAGING_SAFETY_ENFORCE: 'true'
          STAGING_SAFETY_DB_NAME: last132_agent
        run: npm run build
  # Deployment is fail-closed until the staging service and preview access are hardened.
  # Never invoke drvo:migrate here; migrations require separate approval and backup.
  # Read-only VPS audit; runs only after the staging build passes.
  # No checkout, pull, service restart, or migrations on the VPS.
  audit:
    needs: check
    if: github.ref == 'refs/heads/feature/drvo-clinics-mvp'
    runs-on: ubuntu-latest
    environment: drvo-staging
    timeout-minutes: 10
    steps:
      - name: Configure pinned SSH
        env:
          SSH_KEY: ${{ secrets.STAGING_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.STAGING_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          test -n "$SSH_KEY" && test -n "$KNOWN_HOSTS"
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
      - name: Read-only runtime audit (no deploy or migration)
        env:
          HOST: ${{ secrets.STAGING_HOST }}
          USER: ${{ secrets.STAGING_USER }}
          PORT: ${{ secrets.STAGING_SSH_PORT }}
        run: |
          set -euo pipefail
          test -n "$HOST" && test -n "$USER" && test -n "$PORT"
          ssh -i ~/.ssh/id_ed25519 -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=10 -p "$PORT" "$USER@$HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          echo '=== Staging runtime audit ==='
          cd /home/casher/drvo-clinics-work
          echo "branch=$(git branch --show-current)"
          echo "commit=$(git rev-parse --short HEAD)"
          echo "dirty_files=$(git status --porcelain | wc -l)"
          echo '=== systemd service status ==='
          systemctl is-enabled drvo-erp-staging.service || true
          systemctl is-active drvo-erp-staging.service || true
          systemctl show drvo-erp-staging.service -p User -p ExecStart -p ExecStartPre -p IPAddressDeny -p IPAddressAllow -p NoNewPrivileges -p ProtectSystem -p ProtectHome --no-pager
          echo '=== localhost listener ==='
          ss -ltn '( sport = :5501 )' || true
          echo '=== Nginx config validity (nonprivileged only) ==='
          if command -v nginx >/dev/null 2>&1; then
            nginx -t 2>&1 | tail -n 5 || true
          fi
          echo '=== staging HTTP response (no response body) ==='
          curl -sS -o /dev/null -w 'local_http_status=%{http_code}\n' --connect-timeout 3 --max-time 5 http://127.0.0.1:5501/ || true
          echo 'AUDIT_ONLY_NO_DEPLOY_NO_MIGRATION'
          REMOTE

  deploy:
    needs: [check, audit]
    if: github.ref == 'refs/heads/feature/drvo-clinics-mvp'
    runs-on: ubuntu-latest
    environment: drvo-staging
    timeout-minutes: 15
    steps:
      - name: Configure pinned SSH
        env:
          SSH_KEY: ${{ secrets.STAGING_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.STAGING_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          test -n "$SSH_KEY" && test -n "$KNOWN_HOSTS"
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
      - name: Fail-closed staging deploy (no database migrations)
        env:
          HOST: ${{ secrets.STAGING_HOST }}
          USER: ${{ secrets.STAGING_USER }}
          PORT: ${{ secrets.STAGING_SSH_PORT }}
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          test -n "$HOST" && test -n "$USER" && test -n "$PORT"
          ssh -i ~/.ssh/id_ed25519 -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=10 -p "$PORT" "$USER@$HOST" "EXPECTED_SHA=$EXPECTED_SHA bash -s" <<'REMOTE'
          set -euo pipefail
          cd /home/casher/drvo-clinics-work
          test "$(git branch --show-current)" = "feature/drvo-clinics-mvp"
          test -z "$(git status --porcelain)"
          # Explicit, non-secret failure labels for safe runtime diagnosis.
          fail() { echo "STAGING_DEPLOY_BLOCKED: $1"; exit 1; }
          envfile=/home/casher/.config/drvo-staging.env
          test -f "$envfile" || fail "STAGING_ENV_MISSING"
          test "$(stat -c %a "$envfile")" = 600 || fail "STAGING_ENV_PERMISSIONS"
          test "$(stat -c %U "$envfile")" = casher || fail "STAGING_ENV_OWNER"
          service_state="$(systemctl is-active drvo-erp-staging.service 2>/dev/null || true)"
          test "$service_state" = active || fail "STAGING_SERVICE_NOT_ACTIVE"
          deny="$(systemctl show -P IPAddressDeny drvo-erp-staging.service 2>/dev/null || true)"
          test "$deny" = any || fail "STAGING_IP_DENY_NOT_ENFORCED"
          allow="$(systemctl show -P IPAddressAllow drvo-erp-staging.service 2>/dev/null || true)"
          printf '%s\n' "$allow" | grep -Eq '127[.]0[.]0[.]1|localhost' || fail "STAGING_LOOPBACK_NOT_ALLOWED"
          prestart="$(systemctl show -P ExecStartPre drvo-erp-staging.service 2>/dev/null || true)"
          printf '%s\n' "$prestart" | grep -Fq 'staging-egress-probe.mjs' || fail "STAGING_EGRESS_PROBE_NOT_INSTALLED"
          marker=/home/casher/.config/drvo-staging-preview-auth-verified
          test -f "$marker" || fail "STAGING_PREVIEW_AUTH_NOT_VERIFIED"
          test "$(stat -c %U "$marker")" = casher || fail "STAGING_PREVIEW_AUTH_MARKER_OWNER"
          # Update only the isolated checkout; never touch production checkout.
          git fetch --no-tags origin feature/drvo-clinics-mvp
          test "$(git rev-parse origin/feature/drvo-clinics-mvp)" = "$EXPECTED_SHA"
          git merge --ff-only "$EXPECTED_SHA"
          bash scripts/drvo/staging-config-preflight.sh
          npm ci --ignore-scripts
          npm run build
          # Restart requires a tightly scoped service permission; never use unrestricted sudo.
          sudo -n /bin/systemctl restart drvo-erp-staging.service
          test "$(systemctl is-active drvo-erp-staging.service)" = active
          curl --fail --silent --show-error --max-time 10 -o /dev/null http://127.0.0.1:5501/
          echo "STAGING_DEPLOY_PASS"
          REMOTE
