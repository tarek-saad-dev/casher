name: CUT CLUB Membership Drafts Real SQL — Disposable
on:
  pull_request:
    branches: [main]
    paths:
      - 'src/lib/cut-club/membership*.ts'
      - 'src/lib/cut-club/memberMembershipRead.ts'
      - 'src/app/api/public/cut-club/memberships/**'
      - 'src/lib/__tests__/cutClubMembership*.test.ts'
      - 'src/app/api/admin/cut-club/membership-*/**'
      - 'src/app/admin/cut-club/membership-*/**'
      - 'docs/cut-club/sql/membership-draft-staging-only.sql'
      - 'docs/cut-club/sql/membership-proof-staging-only.sql'
      - 'docs/cut-club/sql/membership-trial-staging-only.sql'
      - 'docs/cut-club/sql/membership-publication-staging-only.sql'
      - 'docs/cut-club/sql/membership-application-staging-only.sql'
      - 'docs/cut-club/sql/membership-application-fulfillment-staging-only.sql'
      - 'docs/cut-club/sql/membership-benefit-approval-staging-only.sql'
      - 'docs/cut-club/sql/membership-benefit-usage-staging-only.sql'
      - 'scripts/cut-club/ci/seed-membership-draft.cjs'
      - '.github/workflows/cut-club-membership-draft-sql.yml'
permissions:
  contents: read
jobs:
  isolated-sql:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      sqlserver:
        image: mcr.microsoft.com/mssql/server:2022-latest
        ports:
          - 1433:1433
        env:
          ACCEPT_EULA: "Y"
          MSSQL_SA_PASSWORD: "Disposable-Membership-SQL-2026!"
    env:
      CI: "true"
      MEMBERSHIP_EPHEMERAL_SQL: "1"
      MEMBERSHIP_EPHEMERAL_HOST: "127.0.0.1"
      MEMBERSHIP_EPHEMERAL_SA: "Disposable-Membership-SQL-2026!"
      MEMBERSHIP_EPHEMERAL_AGENT: "Disposable-Membership-Agent-2026!"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Require disposable localhost, no production credentials
        run: |
          test "$CI" = true
          test "$MEMBERSHIP_EPHEMERAL_HOST" = 127.0.0.1
          test "$MEMBERSHIP_EPHEMERAL_SQL" = 1
          test -z "${DB_SERVER:-}"
          test -z "${CLOUD_DB_SERVER:-}"
      - run: node scripts/cut-club/ci/seed-membership-draft.cjs
      - run: npx vitest run src/lib/__tests__/cutClubMembershipPolicy.test.ts src/lib/__tests__/cutClubMembershipDraft.test.ts src/lib/__tests__/cutClubMembershipDraftRealSql.test.ts src/lib/__tests__/cutClubMembershipProof.test.ts src/lib/__tests__/cutClubMembershipProofRealSql.test.ts src/lib/__tests__/cutClubMembershipTrialRealSql.test.ts src/lib/__tests__/cutClubMembershipMemberReadRealSql.test.ts
      - run: npx vitest run src/lib/__tests__/cutClubMembershipApplicationTrial.test.ts src/lib/__tests__/cutClubMembershipApplicationLifecycleRealSql.test.ts
      - run: npx vitest run src/lib/__tests__/cutClubMembershipBenefitDraft.test.ts src/lib/__tests__/cutClubMembershipBenefitPreview.test.ts src/lib/__tests__/cutClubMembershipBenefitDraftRealSql.test.ts
      - run: npx vitest run src/lib/__tests__/cutClubMembershipBenefitApproval.test.ts src/lib/__tests__/cutClubMembershipBenefitApprovalRealSql.test.ts
      - run: npx vitest run src/lib/__tests__/cutClubMembershipBenefitUsageRealSql.test.ts
