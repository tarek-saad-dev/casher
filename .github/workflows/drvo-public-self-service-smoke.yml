name: DRVO Public Self-Service Smoke # final

on:
  push:
    branches:
      - drvo-migration-013-control
    paths:
      - '.github/workflows/drvo-public-self-service-smoke.yml'

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Public pages are reachable
        run: |
          set -euo pipefail
          for path in drvo start; do
            meta="$(curl --silent --show-error --location --max-time 30               --output "/tmp/$path.html"               --write-out '%{http_code} %{url_effective}'               "https://ops.cutsaloon.com/$path")"
            echo "$path => $meta"
            code="$(printf '%s' "$meta" | cut -d' ' -f1)"
            test "$code" = "200"
            final_url="$(printf '%s' "$meta" | cut -d' ' -f2)"
            test "$final_url" = "https://ops.cutsaloon.com/$path"
            grep -q 'DRVOERP' "/tmp/$path.html"
          done
          echo "PUBLIC_PAGES=PASS"

      - name: Signup API validates without creating data
        run: |
          set -euo pipefail
          code="$(curl --silent --show-error --output /tmp/signup.json --write-out '%{http_code}'             --header 'Content-Type: application/json'             --data '{}'             https://ops.cutsaloon.com/api/public/signup/complete)"
          echo "signup-api => $code"
          cat /tmp/signup.json
          test "$code" = "400"
          grep -q 'INDUSTRY_INVALID' /tmp/signup.json
          echo "PUBLIC_SIGNUP_API_VALIDATION=PASS"

      - name: Existing production login health
        run: |
          curl --fail --silent --show-error --location --max-time 30             https://ops.cutsaloon.com/login > /dev/null
          echo "PRODUCTION_LOGIN_HEALTH=PASS"
