name: DRVO Public Self-Service Smoke

on:
  push:
    branches:
      - drvo-migration-013-control
    paths:
      - '.github/workflows/drvo-public-self-service-smoke.yml'

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Public landing is live
        run: |
          set -euo pipefail
          body="$(curl --fail --silent --show-error --location --max-time 30 https://ops.cutsaloon.com/drvo)"
          printf '%s' "$body" | grep -q 'صالونك كله'
          printf '%s' "$body" | grep -q 'ابدأ تجربتك'
          echo "PUBLIC_LANDING=PASS"

      - name: Signup wizard is live
        run: |
          set -euo pipefail
          body="$(curl --fail --silent --show-error --location --max-time 30 https://ops.cutsaloon.com/start)"
          printf '%s' "$body" | grep -q 'بيزنسك إيه'
          echo "PUBLIC_SIGNUP_UI=PASS"

      - name: Signup API validates without creating data
        run: |
          set -euo pipefail
          code="$(curl --silent --show-error --output /tmp/signup.json --write-out '%{http_code}'             --header 'Content-Type: application/json'             --data '{}'             https://ops.cutsaloon.com/api/public/signup/complete)"
          cat /tmp/signup.json
          test "$code" = "400"
          grep -q 'INDUSTRY_INVALID' /tmp/signup.json
          echo "PUBLIC_SIGNUP_API_VALIDATION=PASS"

      - name: Existing production login health
        run: |
          curl --fail --silent --show-error --location --max-time 30             https://ops.cutsaloon.com/login > /dev/null
          echo "PRODUCTION_LOGIN_HEALTH=PASS"
