name: HR Financial Schedule — Staging Read Only

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - 'src/lib/hr/late-deduction/**'
      - 'src/modules/attendance/application/AttendanceCommandService.ts'
      - 'scripts/drvo/hr-financial-schedule-staging-smoke.ts'
      - '.github/workflows/hr-financial-schedule-staging.yml'

permissions:
  contents: read

concurrency:
  group: hr-financial-staging-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  hr-schedule-readonly:
    if: >
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'fix/hr-payroll-schedule-not-booking-hours'
    runs-on: ubuntu-latest
    environment: drvo-staging
    timeout-minutes: 20
    env:
      DRVO_STAGING_SSH_HOST: ${{ secrets.DRVO_STAGING_SSH_HOST || secrets.STAGING_HOST || secrets.VPS_HOST }}
      DRVO_STAGING_SSH_KEY: ${{ secrets.DRVO_STAGING_SSH_KEY }}
      DRVO_STAGING_DB_PASSWORD: ${{ secrets.DRVO_STAGING_DB_PASSWORD }}
      DB_DATABASE: last132_agent
      DB_USER: drvo_agent
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Refuse production env files or missing staging secrets
        run: |
          set -euo pipefail
          for f in .env .env.local .env.production .env.production.local; do
            if [[ -f "$f" ]]; then echo "Refusing checked-out production env: $f" >&2; exit 10; fi
          done
          for key in DRVO_STAGING_SSH_HOST DRVO_STAGING_SSH_KEY DRVO_STAGING_DB_PASSWORD; do
            if [[ -z "${!key:-}" ]]; then echo "Missing staging secret: $key" >&2; exit 11; fi
          done

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Open dedicated staging SQL tunnel
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$DRVO_STAGING_SSH_KEY" > ~/.ssh/drvo_staging
          chmod 600 ~/.ssh/drvo_staging
          ssh-keyscan -H "$DRVO_STAGING_SSH_HOST" >> ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
          ssh -i ~/.ssh/drvo_staging -o BatchMode=yes -o ExitOnForwardFailure=yes \
            -o ServerAliveInterval=30 -L 14330:127.0.0.1:1433 \
            "drvo-tunnel@$DRVO_STAGING_SSH_HOST" -N &
          echo $! > /tmp/hr-financial-staging-tunnel.pid
          for i in {1..30}; do
            if nc -z 127.0.0.1 14330; then echo 'Staging tunnel ready'; exit 0; fi
            sleep 1
          done
          echo 'Staging SQL tunnel unavailable' >&2
          exit 12

      - name: Verify dedicated SQL staging identity
        run: npx tsx scripts/drvo/staging-gate-preflight.ts identity

      - name: Execute READ-ONLY HR/booking financial schedule SQL smoke
        run: npx tsx scripts/drvo/hr-financial-schedule-staging-smoke.ts

      - name: Close staging tunnel
        if: always()
        run: |
          if [[ -f /tmp/hr-financial-staging-tunnel.pid ]]; then
            kill "$(cat /tmp/hr-financial-staging-tunnel.pid)" 2>/dev/null || true
          fi
