name: Receipt Studio SQL Migration (manual)

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "PLAN shows instructions without DB writes; APPLY requires verified backup"
        required: true
        default: PLAN
        type: choice
        options:
          - PLAN
          - APPLY
      backup_confirmation:
        description: "For APPLY type exactly: I_HAVE_A_VERIFIED_BACKUP"
        required: false
        type: string

concurrency:
  group: casher-receipt-studio-schema
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  migrate:
    name: Receipt Studio SQL schema
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Require explicit backup proof for APPLY
        env:
          MODE: ${{ inputs.mode }}
          CONFIRMATION: ${{ inputs.backup_confirmation }}
        run: |
          if [[ "$MODE" == "APPLY" && "$CONFIRMATION" != "I_HAVE_A_VERIFIED_BACKUP" ]]; then
            echo "::error::APPLY refused — verified SQL backup confirmation missing."
            exit 1
          fi
      - uses: actions/checkout@v4
      - name: Configure SSH
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "$VPS_HOST" >> ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
      - name: Run backup-gated migration on production VPS
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          MODE: ${{ inputs.mode }}
        run: |
          set -euo pipefail
          # Do not execute a PR checkout on the server; only the deployed main files.
          if [[ "$MODE" == "APPLY" ]]; then
            echo "APPLY: explicitly approved schema-only Receipt Studio migration"
            ssh -i ~/.ssh/id_ed25519 -o BatchMode=yes "$VPS_USER@$VPS_HOST" \
              "cd /home/casher/app && runuser -u casher -- npx tsx scripts/receipt-studio/apply-migration.ts --apply --backup-verified"
          else
            echo "PLAN: dry run; no database writes"
            ssh -i ~/.ssh/id_ed25519 -o BatchMode=yes "$VPS_USER@$VPS_HOST" \
              "cd /home/casher/app && runuser -u casher -- npx tsx scripts/receipt-studio/apply-migration.ts"
          fi
