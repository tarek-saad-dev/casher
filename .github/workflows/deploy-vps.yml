name: Deploy Casher to VPS

on:
  push:
    branches:
      - main

  workflow_dispatch:

concurrency:
  group: casher-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy Production
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure SSH
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519

          ssh-keyscan -H "$VPS_HOST" >> ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Sync application to VPS
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          GITHUB_DEPLOY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          mkdir -p .deploy
          printf '%s' "$GITHUB_DEPLOY_TOKEN" > .deploy/github-token

          if rsync -az \
            --exclude '.env' \
            --exclude '.env.local' \
            --exclude '.env.production' \
            --exclude '.env.production.local' \
            --exclude 'node_modules' \
            --exclude '.next' \
            --exclude 'public/uploads' \
            --exclude 'uploads' \
            --exclude '.git' \
            -e "ssh -i ~/.ssh/id_ed25519 -o BatchMode=yes" \
            ./ "$VPS_USER@$VPS_HOST:/home/casher/app/"; then
            ssh \
              -i ~/.ssh/id_ed25519 \
              -o BatchMode=yes \
              "$VPS_USER@$VPS_HOST" \
              "mkdir -p /home/casher/app/.deploy && printf '%s' '${{ github.sha }}' > /home/casher/app/.deploy/ci-sync-sha"
          else
            echo "WARNING: rsync failed — deploy will fall back to git fetch on VPS"
            ssh \
              -i ~/.ssh/id_ed25519 \
              -o BatchMode=yes \
              "$VPS_USER@$VPS_HOST" \
              "rm -f /home/casher/app/.deploy/ci-sync-sha" || true
          fi

          ssh \
            -i ~/.ssh/id_ed25519 \
            -o BatchMode=yes \
            "$VPS_USER@$VPS_HOST" \
            "if [ -d /home/casher/app/.git ]; then
               git -C /home/casher/app remote set-url origin \
                 'https://x-access-token:${GITHUB_DEPLOY_TOKEN}@github.com/tarek-saad-dev/casher.git' || true
             fi"

      - name: Deploy to VPS
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          ssh \
            -i ~/.ssh/id_ed25519 \
            -o BatchMode=yes \
            "$VPS_USER@$VPS_HOST" \
            "sudo /usr/local/sbin/deploy-casher"

      - name: Restart messaging workers
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          ssh \
            -i ~/.ssh/id_ed25519 \
            -o BatchMode=yes \
            "$VPS_USER@$VPS_HOST" \
            'sudo systemctl restart messaging-worker.service || true
             sudo systemctl restart messaging-inbox-worker.service || true
             export XDG_RUNTIME_DIR="/run/user/$(id -u)"
             systemctl --user restart messaging-worker.service || true
             systemctl --user is-active messaging-worker.service || true'

      - name: Verify Production
        run: |
          curl \
            --fail \
            --silent \
            --show-error \
            --location \
            --max-time 30 \
            https://ops.cutsaloon.com/login > /dev/null

          echo "Production health check: OK"
