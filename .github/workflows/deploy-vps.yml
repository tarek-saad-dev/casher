name: Deploy Casher to VPS

on:
  push:
    branches:
      - main

  workflow_dispatch:

concurrency:
  group: casher-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy Production
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Configure SSH
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519

          ssh-keyscan -H "$VPS_HOST" >> ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Prepare VPS repository
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          ssh \
            -i ~/.ssh/id_ed25519 \
            -o BatchMode=yes \
            "$VPS_USER@$VPS_HOST" \
            "sudo -u casher bash -lc '
              cd /home/casher/app
              if ! git diff --quiet || ! git diff --cached --quiet; then
                echo \"Pre-deploy: discarding local tracked changes\"
                git status --short || true
                git reset --hard HEAD
              fi
            '"

      - name: Deploy to VPS
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          ssh \
            -i ~/.ssh/id_ed25519 \
            -o BatchMode=yes \
            "$VPS_USER@$VPS_HOST" \
            "sudo /usr/local/sbin/deploy-casher"

      - name: Restart messaging workers
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          ssh \
            -i ~/.ssh/id_ed25519 \
            -o BatchMode=yes \
            "$VPS_USER@$VPS_HOST" \
            'sudo systemctl restart messaging-worker.service || true
             sudo systemctl restart messaging-inbox-worker.service || true
             export XDG_RUNTIME_DIR="/run/user/$(id -u)"
             systemctl --user restart messaging-worker.service || true
             systemctl --user is-active messaging-worker.service || true'

      - name: Verify Production
        run: |
          curl \
            --fail \
            --silent \
            --show-error \
            --location \
            --max-time 30 \
            https://ops.cutsaloon.com/login > /dev/null

          echo "Production health check: OK"
