name: DRVO Staging Gate

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: drvo-staging-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  staging-gate:
    if: >
      (github.event_name == 'workflow_dispatch') ||
      (
        github.event.pull_request.head.repo.full_name == github.repository &&
        (
          github.event.pull_request.head.ref == 'drvo-012-commercial-plans-tenant-apps' ||
          github.event.pull_request.head.ref == 'feat/automatic-employee-late-deductions' ||
          github.event.pull_request.head.ref == 'feat/referrals-tenant-schema-223' ||
          github.event.pull_request.head.ref == 'feat/cut-referrals-integration-244' ||
          github.event.pull_request.head.ref == 'feat/pos-sale-idempotency-246'
        )
      )
    runs-on: ubuntu-latest
    environment: drvo-staging
    # Reconcile + 011/012 smokes can exceed 30m on staging; keep headroom after DRVO-020.
    timeout-minutes: 70

    env:
      DRVO_STAGING_SSH_HOST: ${{ secrets.DRVO_STAGING_SSH_HOST || secrets.STAGING_HOST || secrets.VPS_HOST }}
      DRVO_STAGING_SSH_KEY: ${{ secrets.DRVO_STAGING_SSH_KEY }}
      DRVO_STAGING_DB_PASSWORD: ${{ secrets.DRVO_STAGING_DB_PASSWORD }}
      DRVO_STAGING_DB_SERVER: 127.0.0.1
      DRVO_STAGING_DB_PORT: '14330'
      DB_SERVER: 127.0.0.1
      DB_PORT: '14330'
      DB_DATABASE: last132_agent
      DB_USER: drvo_agent
      DB_PASSWORD: ${{ secrets.DRVO_STAGING_DB_PASSWORD }}
      DB_ENCRYPT: 'false'
      DB_TRUST_SERVER_CERTIFICATE: 'true'
      CLOUD_DB_SERVER: 127.0.0.1
      CLOUD_DB_PORT: '14330'
      CLOUD_DB_NAME: last132_agent
      CLOUD_DB_USER: drvo_agent
      CLOUD_DB_PASSWORD: ${{ secrets.DRVO_STAGING_DB_PASSWORD }}
      CLOUD_DB_ENCRYPT: 'false'
      CLOUD_DB_TRUST_CERT: 'true'
      DEPLOY_COMMIT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Refuse local env files
        run: |
          set -euo pipefail
          for f in .env .env.local .env.production .env.production.local; do
            if [[ -f "$f" ]]; then
              echo "Refusing staging gate: repository checkout contains $f" >&2
              exit 10
            fi
          done

      - name: Check staging secrets are configured
        run: |
          set -euo pipefail
          missing=0
          for key in DRVO_STAGING_SSH_HOST DRVO_STAGING_SSH_KEY DRVO_STAGING_DB_PASSWORD; do
            if [[ -z "${!key:-}" ]]; then
              echo "Missing required staging secret: $key" >&2
              missing=1
            fi
          done
          [[ "$missing" -eq 0 ]] || exit 11

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Late deduction isolated regression tests
        if: github.event.pull_request.head.ref == 'feat/automatic-employee-late-deductions'
        run: npx vitest run src/lib/hr/late-deduction/__tests__

      - name: Configure staging SSH key
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$DRVO_STAGING_SSH_KEY" > ~/.ssh/drvo_staging
          chmod 600 ~/.ssh/drvo_staging
          ssh-keyscan -H "$DRVO_STAGING_SSH_HOST" >> ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Open staging SQL tunnel
        run: |
          set -euo pipefail
          ssh \
            -i ~/.ssh/drvo_staging \
            -o BatchMode=yes \
            -o ExitOnForwardFailure=yes \
            -o ServerAliveInterval=30 \
            -L 14330:127.0.0.1:1433 \
            "drvo-tunnel@$DRVO_STAGING_SSH_HOST" \
            -N &
          echo $! > /tmp/drvo-staging-tunnel.pid

          for i in {1..30}; do
            if nc -z 127.0.0.1 14330; then
              echo "Staging SQL tunnel ready."
              exit 0
            fi
            sleep 1
          done

          echo "Staging SQL tunnel did not become ready." >&2
          exit 12

      - name: Prove staging identity
        run: |
          set -euo pipefail
          npx tsx scripts/drvo/staging-gate-preflight.ts identity

      - name: Apply DRVO migrations to staging only
        run: npm run drvo:migrate -- --expected-database=last132_agent

      - name: DRVO-020 real ledger and manager SQL smoke (staging only)
        if: github.event.pull_request.head.ref == 'feat/automatic-employee-late-deductions'
        timeout-minutes: 6
        run: npx tsx scripts/drvo/drvo020-late-deduction-staging-smoke.ts

      - name: DRVO-023 tenant referral SQL / concurrency smoke (rollback only)
        if: github.event_name == 'pull_request' && (github.event.pull_request.head.ref == 'feat/referrals-tenant-schema-223' || github.event.pull_request.head.ref == 'feat/cut-referrals-integration-244' || github.event.pull_request.head.ref == 'feat/pos-sale-idempotency-246')
        timeout-minutes: 8
        run: npx tsx scripts/drvo/drvo023-referral-staging-smoke.ts

      - name: DRVO-024 POS sale idempotency SQL smoke (staging rollback only)
        if: github.event_name == 'pull_request' && github.event.pull_request.head.ref == 'feat/pos-sale-idempotency-246'
        timeout-minutes: 6
        run: npx tsx scripts/drvo/drvo024-sale-idempotency-staging-smoke.ts

      - name: CUT referral 248 financial ledger audit (staging read-only)
        if: github.event_name == 'pull_request' && github.event.pull_request.head.ref == 'feat/pos-sale-idempotency-246'
        timeout-minutes: 5
        run: npx tsx scripts/drvo/drvo248-referral-financial-audit-staging.ts

      # Runs actual extracted/legacy SQL sale executors in one SERIALIZABLE
      # transaction. All synthetic customer, invoice, reward, stock and cash
      # writes are rolled back, and residual absence is asserted afterwards.
      # Not a browser HTTP or independently audited production acceptance.
      - name: CUT referral 248 SQL 50-20 both-writer transaction E2E (ROLLBACK)
        if: github.event_name == 'pull_request' && github.event.pull_request.head.ref == 'feat/pos-sale-idempotency-246'
        timeout-minutes: 10
        run: npx tsx scripts/drvo/drvo248-referral-transaction-e2e-staging.ts

      - name: Verify migration 9 ledger
        run: |
          set -euo pipefail
          npx tsx scripts/drvo/staging-gate-preflight.ts migration9

      # #248 integration is deterministic: repair missing historical commercial
      # subscriptions BEFORE full readiness validation, then fail closed on
      # every other check. Never mask bootstrap/ownership failures by repeating
      # an unrelated subscription repair.
      - name: Reconcile missing DRVO-012 subscriptions on staging integration only
        if: >-
          github.event_name == 'pull_request' &&
          github.event.pull_request.head.ref == 'feat/pos-sale-idempotency-246'
        run: npm run drvo-012:reconcile-subscriptions -- --expected-database=last132_agent

      - name: Verify DRVO after migration
        id: verify_after_migration
        continue-on-error: ${{ github.event.pull_request.head.ref != 'feat/pos-sale-idempotency-246' }}
        run: npm run drvo:verify

      # Legacy DRVO branches keep their pre-existing recovery behavior.
      # For #248 this step MUST NEVER be a fallback for a noncommercial error.
      - name: Reconcile grandfathered subscriptions if required
        if: >-
          steps.verify_after_migration.outcome == 'failure' &&
          github.event.pull_request.head.ref != 'feat/pos-sale-idempotency-246'
        run: |
          set -euo pipefail
          npm run drvo-012:reconcile-subscriptions -- --expected-database=last132_agent
          npm run drvo:verify

      - name: DRVO-012 staging smoke
        run: npm run drvo-012:smoke

      - name: DRVO-011 regression smoke
        run: npm run drvo-011:smoke

      - name: Cleanup proof
        run: |
          set -euo pipefail
          npx tsx scripts/drvo/staging-gate-preflight.ts cleanup

      - name: Final DRVO verify
        run: npm run drvo:verify

      # Exercise actual paid invoice creation/edits/deletes through BOTH existing
      # POS writers after all DRVO commercial and tenant gates pass. The test
      # has staging identity guard and synthetic smoke-client cleanup.
      # Not a substitute for the remaining dedicated 50/20 financial E2E.
      - name: CUT POS both-writer real sale staging smoke (legacy and extracted)
        if: github.event_name == 'pull_request' && github.event.pull_request.head.ref == 'feat/pos-sale-idempotency-246'
        timeout-minutes: 9
        env:
          WHATSAPP_INTEGRATION_ENABLED: 'false'
          WHATSAPP_SALE_ENABLED: 'false'
          WHATSAPP_EMPLOYEE_SALE_ENABLED: 'false'
        run: npx tsx scripts/drvo-008-pos-staging-smoke.ts

      - name: Report PASS
        run: |
          {
            echo "## DRVO-012 staging gate PASS"
            echo
            echo "- DB: last132_agent"
            echo "- Login: drvo_agent"
            echo "- Migration: 9 / commercial-subscription-tenant-apps"
            echo "- Checksum: a711f08b6e4ff2954611145120ed6d26634e55d0c67a9ecbc35bc3b792f96427"
            echo "- DRVO-012 smoke: PASS"
            echo "- DRVO-011 smoke: PASS"
            echo "- Cleanup: PASS"
            echo "- Final verify: PASS"
          } >> "$GITHUB_STEP_SUMMARY"
