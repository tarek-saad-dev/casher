name: DRVOWA Audited Invoice Deletion Cursor — Read-only Staging

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: drvowa-deleted-invoice-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  audited-deletion-readonly:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'feature/drvowa-audited-invoice-delete-cursor'
    runs-on: ubuntu-latest
    environment: drvo-staging
    timeout-minutes: 12
    env:
      DRVO_STAGING_SSH_HOST: ${{ secrets.DRVO_STAGING_SSH_HOST || secrets.STAGING_HOST || secrets.VPS_HOST }}
      DRVO_STAGING_SSH_KEY: ${{ secrets.DRVO_STAGING_SSH_KEY }}
      DRVO_STAGING_DB_PASSWORD: ${{ secrets.DRVO_STAGING_DB_PASSWORD }}
      DB_DATABASE: last132_agent
      CLOUD_DB_NAME: last132_agent
    steps:
      - name: Checkout the exact review commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Refuse untrusted local or production environment files
        shell: bash
        run: |
          set -euo pipefail
          for f in .env .env.local .env.production .env.production.local; do
            if [[ -f "$f" ]]; then echo "Unsafe environment file: $f" >&2; exit 10; fi
          done
          for key in DRVO_STAGING_SSH_HOST DRVO_STAGING_SSH_KEY DRVO_STAGING_DB_PASSWORD; do
            if [[ -z "${!key:-}" ]]; then echo "Missing staging-only credential: $key" >&2; exit 11; fi
          done
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Establish staging-only SSH tunnel
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$DRVO_STAGING_SSH_KEY" > ~/.ssh/drvowa_staging
          chmod 600 ~/.ssh/drvowa_staging
          ssh-keyscan -H "$DRVO_STAGING_SSH_HOST" >> ~/.ssh/known_hosts
          ssh -i ~/.ssh/drvowa_staging -o BatchMode=yes \
            -o ExitOnForwardFailure=yes -o ServerAliveInterval=30 \
            -L 14330:127.0.0.1:1433 "drvo-tunnel@$DRVO_STAGING_SSH_HOST" -N &
          echo $! > /tmp/drvowa-audit-tunnel.pid
          for i in {1..30}; do
            if nc -z 127.0.0.1 14330; then exit 0; fi
            sleep 1
          done
          echo "Dedicated staging SQL tunnel unavailable" >&2
          exit 12
      - name: Prove audited deletion cursor works as staging read-only user
        timeout-minutes: 5
        run: npx tsx scripts/drvo/crm-invoice-deletion-cursor-staging.ts
      - name: Close isolated SSH tunnel
        if: always()
        shell: bash
        run: |
          if [[ -f /tmp/drvowa-audit-tunnel.pid ]]; then
            kill "$(cat /tmp/drvowa-audit-tunnel.pid)" || true
          fi
